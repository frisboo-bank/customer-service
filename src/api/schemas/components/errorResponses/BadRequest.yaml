headers:
  X-Request-Id:
    $ref: "../headers/X-Request-Id.yaml"
  X-Correlation-Id:
    $ref: "../headers/X-Correlation-Id.yaml"
content:
  application/problem+json:
    schema:
      $ref: "../schemas/HTTPErrorResponse.yaml"
    examples:
      validation:
        value:
          type: https://api.example.com/problems/invalid-request
