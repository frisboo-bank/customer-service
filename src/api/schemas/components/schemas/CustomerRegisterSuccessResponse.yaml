type: object
additionalProperties: false
properties:
  addresses:
    type: array
    items:
      $ref: "./CustomerAddressInput.yaml"
    uniqueItems: true
    minItems: 1
    description: List of customer addresses
  emails:
    type: array
    items:
      $ref: "./CustomerEmailInput.yaml"
    uniqueItems: true
    minItems: 1
    description: >
      List of customer emails. Provide at least one item.
  identityDocuments:
    type: array
    items:
      $ref: "./CustomerIdentityDocumentInput.yaml"
    uniqueItems: true
    minItems: 1
    description: >
      List of customer identity documents. Provide at least one item.
  nationalities:
    type: array
    items:
      $ref: "./CustomerNationalityInput.yaml"
    uniqueItems: true
    minItems: 1
    description: >
      List of customer nationality codes in ISO 3166-1 alpha-2 format
  personalDetails:
    $ref: "./CustomerPersonalDetailsInput.yaml"
    description: Customer personal details.
  phoneNumbers:
    type: array
    items:
      $ref: "./CustomerPhoneNumberInput.yaml"
    uniqueItems: true
    minItems: 1
    description: List of customer phone numbers.
  transaction:
    description: Details about the registration trigger transaction.
    $ref: "./TransactionDetailsInput.yaml"
