type: object
description: RFC 7807 Problem Details
additionalProperties: true
#patternProperties:
#  ^x-:
#    description: Vendor-specific extension member
#    nullable: true
required:
  - title
  - status
properties:
  type:
    type: string
    format: uri-reference
    description: A URI reference that identifies the problem type.
    default: about:blank
    maxLength: 2048
    readOnly: true
  title:
    type: string
    description: A short, human-readable summary of the problem type.
    minLength: 1
    maxLength: 200
    readOnly: true
  status:
    type: integer
    format: int32
    description: HTTP status code generated by the origin server.
    minimum: 400
    maximum: 599
    readOnly: true
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence of the problem.
    minLength: 1
    maxLength: 2000
    readOnly: true
  instance:
    type: string
    format: uri-reference
    description: A URI reference that identifies the specific occurrence of the problem.
    maxLength: 2048
    readOnly: true
  correlationId:
    type: string
    description: Correlates this error with a request.
    maxLength: 128
    example: f3beba51-7bcf-4a60-9c6e-4d2b9f6b5d44
    readOnly: true
  code:
    type: string
    description: Application-specific error code.
    pattern: ^[A-Z0-9_:\.-]{1,64}$
    example: CUSTOMERS_EMAIL_CONFLICT
    readOnly: true
  errors:
    type: array
    description: Optional list of field-level validation errors.
    minItems: 1
    items:
      $ref: "./ValidationError.yaml"
    readOnly: true
