spring:
  application.name: customer-service (DEV)

  datasource:
    url: jdbc:postgresql://localhost:5432/customers?rewriteBatchedInserts=true
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  exposed:
    show-sql: true
    generate-ddl: false

  flyway:
    baseline-on-migrate: true
    enabled: true
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/customers?rewriteBatchedInserts=true
    execute-in-transaction: true
    locations: classpath:db/migration/postgres
    placeholders:
      outbox_table_name: customer_transactions.outbox
      inbox_table_name: customer_transactions.inbox

  kafka:
    consumer:
      group-id: customer_service_group_id
    bootstrap-servers: localhost:9092


mongo:
  mongoURI: mongodb://mongo:mongo@localhost:27017/?maxPoolSize=20&w=majority

kafka:
  consumer:
    group-id: customer_service_group_id
  bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: DEBUG
    com.frisboo.corebanking.customerservice: ERROR
    org.springframework.web: ERROR
    org.springframework.web.reactive: DEBUG
    org.springframework.context: DEBUG
    org.hibernate: ERROR
    io.r2dbc.postgresql.PARAM: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
